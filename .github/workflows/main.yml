name: Build Kasir Sembako APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o KasirSembakoAndroid.zip
          cd "KasirSembakoAndroid (2)/KasirSembakoAndroid"
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirSembako-APK
          path: KasirSembakoAndroid/app/build/outputs/apk/debug/*.apk
